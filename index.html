<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AcmeCorp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bs-primary: #4a90d9;
        --bs-primary-rgb: 74, 144, 217;
        --bs-link-color: #4a90d9;
        --bs-link-color-rgb: 74, 144, 217;
      }
      .btn-primary {
        --bs-btn-bg: #4a90d9;
        --bs-btn-border-color: #4a90d9;
        --bs-btn-hover-bg: #3a7fc8;
        --bs-btn-hover-border-color: #3a7fc8;
        --bs-btn-active-bg: #3278be;
        --bs-btn-active-border-color: #3278be;
        --bs-btn-disabled-bg: #4a90d9;
        --bs-btn-disabled-border-color: #4a90d9;
      }
      body { background-color: #f8f9fa; }
      .nav-link-sidebar {
        transition: background 0.15s, color 0.15s;
      }
      .nav-link-sidebar:hover {
        background-color: rgba(13, 110, 253, 0.06);
        color: #0d6efd !important;
      }
    </style>
    <script>
      // Restore path encoded by 404.html redirect (GitHub Pages SPA workaround)
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded.slice(1).length ? '?' + decoded.slice(1).join('&') : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
